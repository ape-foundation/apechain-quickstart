name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          # Foundry's libraries (forge-std, OpenZeppelin, ...) are git submodules
          submodules: recursive

      - name: Setup node env
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # This kit targets live ApeChain networks only (no local chain), so CI compiles and tests
      # the contracts instead of deploying them. packages/nextjs/contracts/deployedContracts.ts
      # is committed, so the frontend type-check below doesn't need a deployment.
      - name: Run foundry lint
        run: yarn foundry:lint

      - name: Compile and test contracts (Foundry)
        run: yarn compile && yarn test

      - name: Run hardhat lint
        run: yarn hardhat:lint

      - name: Compile and test contracts (Hardhat)
        run: yarn hardhat:compile && yarn hardhat:test

      - name: Run nextjs lint
        run: yarn next:lint --max-warnings=0

      - name: Check typings on nextjs
        run: yarn next:check-types